name: SLSA Generic Generator
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Si attiva su ogni tag che inizia con 'v' (es. v1.0.0)
  release:
    types: [published]

permissions: read-all

jobs:
  # Fase 1: Calcolo dell'hash del codice sorgente
  hash:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate provenance subject
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          # 1. Crea l'archivio e calcola l'hash
          # 2. Formatta come: "hash  source.tar.gz"
          # 3. Codifica l'intera riga in base64
          HASH=$(git archive --format=tar HEAD | sha256sum | cut -d' ' -f1)
          echo "hashes=$(echo "$HASH  source.tar.gz" | base64 -w0)" >> "$GITHUB_OUTPUT"

  # Fase 2: Generazione dell'attestazione SLSA firmata
  provenance:
    needs: [hash]
    permissions:
      id-token: write   # Obbligatorio per la firma keyless con Sigstore
      contents: write   # Obbligatorio per caricare l'attestazione negli asset della release
      actions: read     # Obbligatorio per validare il contesto del workflow
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: true # Carica automaticamente il file .intoto.jsonl nella Release di GitHub
